[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Public Neon base URL (Auth + Data API are derived by @neon/neon-js).
  SECRETS_SCAN_OMIT_KEYS = "NEON_URL,VITE_NEON_URL,NEON_AUTH_URL,VITE_NEON_AUTH_URL,NEON_DATA_API_URL,VITE_NEON_DATA_API_URL"
  VITE_NEON_URL = "https://ep-shy-night-bd768856.c-8.us-east-2.aws.neon.tech/neondb"
  NEON_URL = "https://ep-shy-night-bd768856.c-8.us-east-2.aws.neon.tech/neondb"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false
